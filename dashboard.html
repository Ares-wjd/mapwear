<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapWear 대시보드 — 차선 상태 지도</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- 링크 미리보기 (카톡·메신저) — 그림은 절대 주소여야 한다 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MapWear">
  <meta property="og:title" content="MapWear 대시보드 — 차선 상태 지도">
  <meta property="og:description" content="20m 구간마다 차선 상태(LCS)를 등급 색으로 보여주는 지도입니다.">
  <meta property="og:url" content="https://ares-wjd.github.io/mapwear/dashboard.html">
  <meta property="og:image" content="https://ares-wjd.github.io/mapwear/assets/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0B1F33">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="assets/style.css?v=202610031018">
</head>
<body class="dash">

<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark"></span>MapWear<small>대시보드</small></a>
  <nav class="nav">
    <a href="index.html">소개</a>
    <button class="btn btn-primary" id="csvBtn" type="button">CSV 다운로드</button>
  </nav>
</header>
<div class="notice" id="notice" hidden></div>

<div class="toolbar">
  <form class="search" id="searchForm" role="search">
    <input id="searchInput" list="roadList" placeholder="도로명 검색" aria-label="도로명 검색">
    <datalist id="roadList"></datalist>
    <button type="submit">검색</button>
  </form>
  <div class="chips" id="chips" aria-label="등급 필터"></div>
  <button class="btn btn-light btn-sm" id="resetBtn" type="button">초기화</button>
  <span class="spacer"></span>
  <span class="count" id="count"></span>
</div>

<main class="dash-main">
  <div id="map"></div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/config.js?v=202610031018"></script>
<script src="assets/dashboard.js?v=202610031018"></script>
</body>
</html>
